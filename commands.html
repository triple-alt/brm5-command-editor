<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Command Reference</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: #1a1a1a; overflow: hidden; }
body { font-family: Consolas, "Courier New", monospace; }

#app { display: flex; flex-direction: column; height: 100vh; }

#topbar {
  display: flex; align-items: center; gap: 12px;
  padding: 0 14px; height: 40px; flex-shrink: 0;
  background: #111; border-bottom: 1px solid #2a2a2a;
}
#topbar h1 { color: #abb2bf; font-size: 13px; font-weight: 600; }
#cmd-total { color: #4a4a4a; font-size: 11px; }
#search {
  margin-left: auto; width: 190px;
  background: #1e1e1e; border: 1px solid #333; border-radius: 3px;
  color: #abb2bf; font-family: inherit; font-size: 12px;
  padding: 4px 8px; outline: none;
}
#search:focus { border-color: #61afef; }
#search::placeholder { color: #4a4a4a; }

#layout { display: flex; flex: 1; min-height: 0; }

#sidebar {
  width: 170px; flex-shrink: 0; overflow-y: auto;
  border-right: 1px solid #2a2a2a; padding: 8px 0;
  scrollbar-width: thin; scrollbar-color: #333 transparent;
}
.cmd-btn {
  display: block; width: 100%; text-align: left;
  background: none; border: none; color: #777;
  font-family: inherit; font-size: 12px;
  padding: 5px 14px; cursor: pointer;
}
.cmd-btn:hover { background: #252525; color: #abb2bf; }
.cmd-btn.active { background: #2a3a4a; color: #61afef; }
.cmd-btn:focus-visible { outline: 1px solid #61afef; outline-offset: -1px; }
.cmd-btn .sub-count { color: #4a4a4a; font-size: 10px; margin-left: 4px; }
#no-match { color: #444; font-size: 11px; padding: 6px 14px; font-style: italic; }

#content {
  flex: 1; overflow-y: auto; padding: 20px 22px; min-width: 0;
  scrollbar-width: thin; scrollbar-color: #333 transparent;
}
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
::-webkit-scrollbar-track { background: transparent; }

.cmd-name { color: #61afef; font-size: 18px; font-weight: 600; margin-bottom: 6px; }
.cmd-doc { color: #888; font-size: 12px; margin-bottom: 20px; line-height: 1.6; max-width: 68ch; }
.section-title { color: #555; font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 8px; }
.params-table { width: 100%; border-collapse: collapse; margin-bottom: 20px; font-size: 12px; }
.params-table th { color: #555; font-weight: normal; text-align: left; padding: 3px 8px 5px 0; border-bottom: 1px solid #2a2a2a; }
.params-table td { padding: 5px 8px 5px 0; color: #abb2bf; vertical-align: top; border-bottom: 1px solid #1e1e1e; }
.params-table td:first-child { color: #c678dd; width: 110px; }
.params-table td:nth-child(2) { width: 80px; }
.param-enum { color: #666; font-size: 11px; margin-top: 2px; line-height: 1.6; }
.enum-values { word-break: break-word; }
.enum-toggle {
  background: none; border: 1px solid #333; border-radius: 3px;
  color: #61afef; font-family: inherit; font-size: 10px;
  padding: 1px 6px; margin-top: 5px; cursor: pointer;
}
.enum-toggle:hover { background: #252525; border-color: #61afef; }
.subtype-block { margin-bottom: 16px; border-left: 2px solid #2a3a4a; padding-left: 12px; }
.subtype-name { color: #98c379; font-size: 13px; font-weight: 600; margin-bottom: 4px; }
.subtype-doc { color: #777; font-size: 11px; margin-bottom: 8px; }
.example {
  background: #161616; border: 1px solid #2a2a2a; border-radius: 4px;
  padding: 8px 12px; font-size: 12px; color: #abb2bf;
  margin-bottom: 20px; white-space: pre; overflow-x: auto;
}
.no-params { color: #444; font-size: 12px; margin-bottom: 16px; font-style: italic; }
#placeholder { color: #444; font-size: 12px; }

@media (max-width: 620px) {
  #sidebar { width: 120px; }
  #content { padding: 14px; }
  #search { width: 120px; }
}
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <h1>Command Reference</h1>
    <span id="cmd-total"></span>
    <input id="search" type="text" placeholder="filter commands" autocomplete="off" spellcheck="false">
  </div>
  <div id="layout">
    <div id="sidebar"></div>
    <div id="content"><span id="placeholder">Select a command.</span></div>
  </div>
</div>

<script>
const VEHICLE_ENUM    = ['GroundVehicle','Motar','ObjBig','RPG7v2','Mine','Flash','Breach','Igla','C4','HelicopterVehicle','Grenade','None'];
const BOT_SUB         = ['spawn','delete','alert','direct'];
const TRIGGER_SUB     = ['add','addbutton','remove','color','set','activate','reset','create','delete','executable','whitelist'];
const WORLD_SUB       = ['list','load'];
const TIME_SUB        = ['start','stop','now','set'];
const WEATHER_SUB     = ['lunar','set'];
const WEATHER_TYPE    = ['ClearSky','RonoClearSky','Overcast1','Overcast2','Overcast3','Fog1','Fog2','Fog3','Rain1','Rain2','Rain3','Storm1','Storm2','Storm3'];
const FILE_SUB        = ['save','load','delete','loadcopy','savecopy','list','savemodel','deletemodel','insertmodel'];
const PART_TYPES      = ['part','wedge','corner','cylinder','ball'];
const WHITELIST_TYPES = ['Players','Bots','Helicopters','Ground','IsLooping'];
const SQUAD_TYPES     = ['none','red','blue','orange','yellow','green'];
const SQUAD_SPAWN_TYPES = ['neutral','red','blue','orange','yellow','green'];
const COLLISION_TYPES = ['0','1','2','3'];
const TELEPORT_TYPES  = ['all','squad','player','other'];
const BOOL_EN         = ['enable','disable'];
const BOOL_LOCK       = ['lock','unlock'];
const BOOL_FF         = ['enable','disable','all'];

const CMDS = {
  create:      { params: [{name:'world',type:'number',default:1},{name:'type',type:'enum',values:PART_TYPES},{name:'pX',type:'number'},{name:'pY',type:'number'},{name:'pZ',type:'number'}], doc: 'Spawns a primitive shape at given coordinates.', example: 'create 1 part 10 0 5' },
  tween:       { params: [{name:'world',type:'number',default:1},{name:'pUID',type:'uid'},{name:'duration',type:'number'},{name:'pX',type:'number'},{name:'pY',type:'number'},{name:'pZ',type:'number'},{name:'rX',type:'number'},{name:'rY',type:'number'},{name:'rZ',type:'number'}], doc: 'Animates an object to a position and rotation during a set amount of time.', example: 'tween 1 xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx 2.5 10 0 5 0 90 0' },
  color:       { params: [{name:'world',type:'number',default:1},{name:'pUID',type:'uid'},{name:'r',type:'number'},{name:'g',type:'number'},{name:'b',type:'number'}], doc: 'Sets the colour of an object pUID using RGB values (0–255).', example: 'color 1 xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx 255 128 0' },
  transparency:{ params: [{name:'world',type:'number',default:1},{name:'pUID',type:'uid'},{name:'transparency',type:'number'}], doc: 'Sets the transparency of a part (1 = invisible, 0 = fully visible).', example: 'transparency 1 xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx 0.65' },
  material:    { params: [{name:'world',type:'number',default:1},{name:'pUID',type:'uid'},{name:'material',type:'string'}], doc: 'Applies a material to part pUID.', example: 'material 1 xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx brick_clad' },
  explosion:   { params: [{name:'radius',type:'number'},{name:'damage',type:'number'},{name:'pX',type:'number'},{name:'pY',type:'number'},{name:'pZ',type:'number'},{name:'target',type:'enum',values:VEHICLE_ENUM}], doc: 'Crweates an explosion at (pX, pY, pZ) with given radius, damage and target type.', example: 'explosion 10 50 0 0 0 GroundVehicle' },
  move:        { params: [{name:'world',type:'number',default:1},{name:'pUID',type:'uid'},{name:'pX',type:'number'},{name:'pY',type:'number'},{name:'pZ',type:'number'},{name:'rX',type:'number'},{name:'rY',type:'number'},{name:'rZ',type:'number'}], doc: 'Moves and/or rotates a given part to the specified position and rotation.', example: 'move 1 xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx 5 0 5 0 45 0' },
  size:        { params: [{name:'world',type:'number',default:1},{name:'pUID',type:'uid'},{name:'sX',type:'number'},{name:'sY',type:'number'},{name:'sZ',type:'number'}], doc: 'Resize the given part with the given X, Y, Z scale values.', example: 'size 1 xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx 4 2 4' },
  wait:        { params: [{name:'duration',type:'number'}], doc: 'Waits a set number of seconds before the next command executes.', example: 'wait 3' },
  ban:         { params: [{name:'player',type:'string'}], doc: 'Bans the specified player from the server.', example: 'ban PlayerName' },
  serverlock:  { params: [{name:'',type:'boolean',values:BOOL_EN}], doc: 'Locks the server from being able to be joined.', example: 'serverlock enable' },
  kick:        { params: [{name:'player',type:'string'}], doc: 'Kicks the specified player from the server.', example: 'kick PlayerName' },
  duplicate:   { params: [{name:'world',type:'number'},{name:'pUID',type:'uid'}], doc: 'Duplicates the specified part in the given world.', example: 'duplicate 1 xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx' },
  rename:      { params: [{name:'world',type:'number'},{name:'pUID',type:'uid'},{name:'name',type:'string'}], doc: 'Renames the specified object.', example: 'rename 1 xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx MyPart' },
  squad:       { params: [{name:'player',type:'string'},{name:'squad',type:'enum',values:SQUAD_TYPES}], doc: 'Assigns a squad colour to the specified player.', example: 'squad PlayerName blue' },
  compounds:   { params: [{name:'boolean',type:'enum',values:BOOL_EN}], doc: 'Enables or disables compounds globally.', example: 'compounds enable' },
  revive:      { params: [{name:'boolean',type:'enum',values:BOOL_EN}], doc: 'Enables or disables the revive mechanic.', example: 'revive disable' },
  hud:         { params: [{name:'boolean',type:'enum',values:BOOL_EN}], doc: 'Shows or hides the HUD for all players.', example: 'hud disable' },
  firstperson: { params: [{name:'boolean',type:'enum',values:BOOL_LOCK}], doc: 'Locks or unlocks first-person camera mode.', example: 'firstperson lock' },
  friendlyfire:{ params: [{name:'boolean',type:'enum',values:BOOL_FF}], doc: 'Enables, disables, or forces friendly fire for all teams.', example: 'friendlyfire enable' },
  collision:   { params: [{name:'world',type:'number'},{name:'pUID',type:'uid'},{name:'boolean',type:'enum',values:COLLISION_TYPES}], doc: 'Changes the collision attribute of a part. 0 = off, 1–3 = various modes.', example: 'collision 1 xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx 0' },
  teleport:    { params: [{name:'type',type:'enum',values:TELEPORT_TYPES},{name:'target',type:'string'},{name:'pX',type:'number'},{name:'pY',type:'number'},{name:'pZ',type:'number'},{name:'rX',type:'number'},{name:'rY',type:'number'},{name:'rZ',type:'number'}], doc: 'Teleports a player, squad, or all players to the specified position and rotation.', example: 'teleport player PlayerName 0 5 0 0 0 0' },
  spawn:       { params: [{name:'world',type:'number'},{name:'propName',type:'string'},{name:'pX',type:'number'},{name:'pY',type:'number'},{name:'pZ',type:'number'},{name:'rX',type:'number'},{name:'rY',type:'number'},{name:'rZ',type:'number'}], doc: 'Spawns the specified prop at the given position and rotation.', example: 'spawn 1 City1_Ext 0 0 0 0 0 0' },
  weather: {
    params: [{name:'subtype',type:'enum',values:WEATHER_SUB}],
    subtypes: {
      lunar: { params: [{name:'cycle',type:'enum',values:['1','2','3','4','5','6','7','8']}], doc: 'Sets lunar cycle to either 1-8.' },
      set:   { params: [{name:'type',type:'enum',values:WEATHER_TYPE,default:''}], doc: 'Sets weather type. Omit to clear weather.' },
    },
    doc: 'Change weather and lunar options.',
    example: 'weather set ClearSky\nweather set\nweather lunar 2',
  },
  trigger: {
    params: [{name:'subtype',type:'enum',values:TRIGGER_SUB}],
    subtypes: {
      add:        { params: [{name:'world',type:'number'},{name:'uID',type:'uid'}], doc: 'Adds a trigger to the specified part.' },
      addbutton:  { params: [{name:'world',type:'number'},{name:'uID',type:'uid'}], doc: 'Adds a button interact to the specified part.' },
      remove:     { params: [{name:'world',type:'number'},{name:'uID',type:'uid'}], doc: 'Removes the trigger from the specified part.' },
      color:      { params: [{name:'world',type:'number'},{name:'triggerName',type:'string'},{name:'r',type:'number'},{name:'g',type:'number'},{name:'b',type:'number'}], doc: 'Changes the trigger hitbox colour.' },
      set:        { params: [{name:'world',type:'number'},{name:'uID',type:'uid'},{name:'triggerName',type:'string'},{name:'boolean',type:'enum',values:['true','false']}], doc: 'Applies the specified trigger to the specified part.' },
      activate:   { params: [{name:'world',type:'number'},{name:'triggerName',type:'string'}], doc: 'Activates the specified trigger.' },
      reset:      { params: [{name:'world',type:'number'},{name:'triggerName',type:'string'}], doc: 'Resets the specified trigger.' },
      create:     { params: [{name:'world',type:'number'},{name:'name',type:'string'}], doc: 'Creates a new named trigger.' },
      delete:     { params: [{name:'world',type:'number'},{name:'triggerName',type:'string'}], doc: 'Deletes the specified trigger.' },
      executable: { params: [{name:'world',type:'number'},{name:'triggerName',type:'string'},{name:'line',type:'number'},{name:'command',type:'command'}], doc: 'Adds a command to the specified line of a trigger.' },
      whitelist:  { params: [{name:'world',type:'number'},{name:'triggerName',type:'string'},{name:'whitelist',type:'enum',values:WHITELIST_TYPES},{name:'boolean',type:'enum',values:['true','false']}], doc: 'Manages the whitelist for the specified trigger.' },
    },
    doc: 'Create, edit, and attach commands to triggers.',
    example: 'trigger create 1 myTrigger\ntrigger add 1 xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx\ntrigger activate 1 myTrigger',
  },
  bot: {
    params: [{name:'subtype',type:'enum',values:BOT_SUB}],
    subtypes: {
      spawn:  { params: [{name:'world',type:'number'},{name:'name',type:'string'},{name:'pX',type:'number'},{name:'pY',type:'number'},{name:'pZ',type:'number'},{name:'rotation',type:'number',default:0}], doc: 'Spawns a bot at the specified location and rotation.' },
      delete: { params: [{name:'bUID',type:'uid'}], doc: 'Deletes the specified bot.' },
      alert:  { params: [{name:'world',type:'number'},{name:'boolean',type:'enum',values:['true','false']}], doc: 'Alerts or calms all bots in the specified world.' },
      direct: { params: [{name:'bUID',type:'uid'},{name:'mode',type:'enum',values:['weak','strong','direct']},{name:'pX',type:'number'},{name:'pY',type:'number'},{name:'pZ',type:'number'}], doc: 'Directs a bot to move to the specified position using the given priority mode.' },
    },
    doc: 'Spawn, delete, and control bots.',
    example: 'bot spawn 1 Guard 0 0 0\nbot direct xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx strong 10 0 5',
  },
  world: {
    params: [{name:'subtype',type:'enum',values:WORLD_SUB}],
    subtypes: {
      list: { params: [], doc: 'Lists all available worlds.' },
      load: { params: [{name:'savefile',type:'string'},{name:'world',type:'number'}], doc: 'Loads a world from the specified savefile into the given world slot.' },
    },
    doc: 'Load or list worlds.',
    example: 'world list\nworld load mySave 2',
  },
  time: {
    params: [{name:'subtype',type:'enum',values:TIME_SUB}],
    subtypes: {
      start: { params: [], doc: 'Starts the time cycle.' },
      stop:  { params: [], doc: 'Stops the time cycle.' },
      now:   { params: [], doc: 'Returns the current time.' },
      set:   { params: [{name:'time',type:'number'}], doc: 'Sets the time to a specific value.' },
    },
    doc: 'Control the in-game time cycle.',
    example: 'time set 12\ntime start',
  },
  file: {
    params: [{name:'subtype',type:'enum',values:FILE_SUB}],
    subtypes: {
      save:        { params: [{name:'name',type:'string'}], doc: 'Saves the used Worlds into a file with the given name.' },
      load:        { params: [{name:'name',type:'string'}], doc: 'Loads the specified map file.' },
      delete:      { params: [{name:'name',type:'string'}], doc: 'Deletes the specified map file.' },
      loadcopy:    { params: [{name:'name',type:'string'}], doc: 'Loads a copy of the specified map file.' },
      savecopy:    { params: [{name:'name',type:'string'}], doc: 'Saves a copy of the current map with the given name.' },
      list:        { params: [], doc: 'Lists all available map files.' },
      savemodel:   { params: [{name:'name',type:'string'},{name:'world',type:'number'},{name:'uID',type:'uid'}], doc: 'Saves selected model, spawnable in any file.' },
      deletemodel: { params: [{name:'name',type:'string'}], doc: 'Deletes the specified model file.' },
      insertmodel: { params: [{name:'world',type:'number'},{name:'name',type:'string'},{name:'pX',type:'number'},{name:'pY',type:'number'},{name:'pZ',type:'number'},{name:'r',type:'number'}], doc: 'Spawns a saved model into the active World at the specified position and rotation.' },
    },
    doc: 'Manage your RGE save data. Delete, save and load models and maps. \n Note: Any deleted data is DELETED! And can therefore not be recovered.',
    example: 'file save myMap\nfile list\nfile insertmodel 1 myModel 0 0 0 0',
  },
  squadspawn: {
    params: [
      {name: 'pX', type: 'number'},
      {name: 'pY', type: 'number'},
      {name: 'pZ', type: 'number'},
      {name: 'r', type: 'number'},
      {name: 'colour', type: 'enum', values: SQUAD_SPAWN_TYPES}
    ],
    doc: 'Sets the spawn position (x, y, z) and rotation (r) for the specified squad.',
    example: 'squadspawn 100 75 -25 0 red'
  },
};

// ── Rendering ──
const sidebar = document.getElementById('sidebar');
const content = document.getElementById('content');
const search  = document.getElementById('search');
const ENUM_PREVIEW = 12;
let activeBtn = null;
let activeCmd = null;

document.getElementById('cmd-total').textContent = Object.keys(CMDS).length + ' commands';

function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function typeColor(type) {
  if (type === 'number')  return '#61afef';
  if (type === 'uid')     return '#c678dd';
  if (type === 'enum')    return '#e5c07b';
  if (type === 'string')  return '#98c379';
  if (type === 'command') return '#e06c75';
  return '#abb2bf';
}

function renderParamsTable(params) {
  if (!params.length) return '<p class="no-params">No parameters.</p>';
  const rows = params.map(p => {
    let extra = '';
    if (p.type === 'enum') {
      const all = p.values.map(esc).join(', ');
      if (p.values.length > ENUM_PREVIEW) {
        const preview = p.values.slice(0, ENUM_PREVIEW).map(esc).join(', ');
        extra =
          '<div class="param-enum">' +
            '<span class="enum-values" data-preview="' + esc(preview) + '" data-full="' + esc(all) + '">' + preview + '</span>' +
            '<div><button class="enum-toggle" data-open="0">Show all ' + p.values.length + '</button></div>' +
          '</div>';
      } else {
        extra = '<div class="param-enum"><span class="enum-values">' + all + '</span></div>';
      }
    }
    if (p.type === 'uid') extra = '<div class="param-enum">UUID or %variable</div>';
    const defStr = p.default !== undefined ? ' <span style="color:#4a4a4a">(default: ' + esc(p.default) + ')</span>' : '';
    return '<tr><td>' + esc(p.name) + defStr + '</td><td style="color:' + typeColor(p.type) + '">' + p.type + '</td><td>' + extra + '</td></tr>';
  }).join('');
  return '<table class="params-table"><thead><tr><th>parameter</th><th>type</th><th>values</th></tr></thead><tbody>' + rows + '</tbody></table>';
}

function renderCmd(name, spec) {
  let html = '<div class="cmd-name">' + esc(name) + '</div><div class="cmd-doc">' + esc(spec.doc) + '</div>';
  if (spec.subtypes) {
    html += '<div class="section-title">subtypes</div><div>';
    for (const [subName, sub] of Object.entries(spec.subtypes)) {
      const allParams = [...spec.params, ...(sub.params || [])];
      html += '<div class="subtype-block"><div class="subtype-name">' + esc(name) + ' ' + esc(subName) + '</div>' +
              '<div class="subtype-doc">' + esc(sub.doc) + '</div>' + renderParamsTable(allParams) + '</div>';
    }
    html += '</div>';
  } else {
    html += '<div class="section-title">parameters</div>' + renderParamsTable(spec.params);
  }
  if (spec.example) html += '<div class="section-title">example</div><div class="example">' + esc(spec.example) + '</div>';
  content.innerHTML = html;
  content.scrollTop = 0;

  content.querySelectorAll('.enum-toggle').forEach(btn => {
    btn.addEventListener('click', () => {
      const span = btn.closest('.param-enum').querySelector('.enum-values');
      const open = btn.dataset.open === '1';
      span.textContent = open ? span.dataset.preview : span.dataset.full;
      btn.dataset.open = open ? '0' : '1';
      btn.textContent = open ? 'Show all ' + span.dataset.full.split(', ').length : 'Show fewer';
    });
  });
}

function selectCmd(name) {
  const btn = sidebar.querySelector('[data-cmd="' + name + '"]');
  if (activeBtn) activeBtn.classList.remove('active');
  if (btn) { btn.classList.add('active'); activeBtn = btn; }
  activeCmd = name;
  renderCmd(name, CMDS[name]);
  history.replaceState(null, '', '#' + name);
}

Object.entries(CMDS).forEach(([name, spec]) => {
  const btn = document.createElement('button');
  btn.className = 'cmd-btn';
  btn.dataset.cmd = name;
  btn.textContent = name;
  if (spec.subtypes) {
    const count = document.createElement('span');
    count.className = 'sub-count';
    count.textContent = Object.keys(spec.subtypes).length;
    btn.appendChild(count);
  }
  btn.addEventListener('click', () => selectCmd(name));
  sidebar.appendChild(btn);
});

const noMatch = document.createElement('div');
noMatch.id = 'no-match';
noMatch.textContent = 'No command matches.';
noMatch.style.display = 'none';
sidebar.appendChild(noMatch);

search.addEventListener('input', () => {
  const q = search.value.trim().toLowerCase();
  let visible = 0;
  sidebar.querySelectorAll('.cmd-btn').forEach(btn => {
    const name = btn.dataset.cmd;
    const spec = CMDS[name];
    const hit = name.includes(q) ||
      (spec.subtypes && Object.keys(spec.subtypes).some(s => s.includes(q)));
    btn.style.display = hit ? '' : 'none';
    if (hit) visible++;
  });
  noMatch.style.display = visible ? 'none' : '';
});

search.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    const first = Array.from(sidebar.querySelectorAll('.cmd-btn')).find(b => b.style.display !== 'none');
    if (first) selectCmd(first.dataset.cmd);
  }
});

const fromHash = decodeURIComponent(location.hash.slice(1));
selectCmd(CMDS[fromHash] ? fromHash : Object.keys(CMDS)[0]);
</script>
</body>
</html>
